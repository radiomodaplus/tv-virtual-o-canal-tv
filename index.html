<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZonaCafeteraTv App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #000; color: #fff; height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

        /* CONTENEDOR TIPO APP MÓVIL */
        .app-container { width: 100%; height: 100%; max-width: 480px; background: #0b0f19; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        @media (min-width: 481px) { .app-container { height: 92vh; border-radius: 30px; border: 4px solid #1f293d; } }

        /* HEADER */
        .app-header { background: rgba(11, 15, 25, 0.95); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; z-index: 10; }
        .channel-info { display: flex; align-items: center; gap: 10px; }
        .channel-logo { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #ffaa00; }
        .channel-text h1 { font-size: 0.95rem; color: #ffaa00; font-weight: bold; }
        .live-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.65rem; background: rgba(239, 68, 68, 0.2); color: #ef4444; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .live-dot { width: 6px; height: 6px; background: #ef4444; border-radius: 50%; animation: pulse 1.5px infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .btn-icon { background: none; border: none; color: #94a3b8; font-size: 1.3rem; cursor: pointer; padding: 4px; transition: color 0.2s; }
        .btn-icon:hover { color: #ffaa00; }

        /* REPRODUCTOR */
        .player-box { flex: 1; background: #000; position: relative; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        .overlay-play { position: absolute; inset: 0; background: rgba(0,0,0,0.75); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5; }
        .btn-play-big { background: #ffaa00; color: #000; border: none; padding: 14px 32px; font-size: 1.1rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,170,0,0.4); }

        /* CINTILLO */
        .ticker-bar { background: #111827; color: #e2e8f0; padding: 8px 0; border-top: 2px solid #ffaa00; font-size: 0.85rem; overflow: hidden; white-space: nowrap; }
        .ticker-text { display: inline-block; white-space: nowrap; animation: scroll-ticker 25s linear infinite; }
        @keyframes scroll-ticker { 0% { transform: translate3d(100%, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        /* MODAL PIN */
        .modal-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 300px; text-align: center; border: 1px solid #334155; }
        .modal-card h3 { color: #ffaa00; margin-bottom: 15px; font-size: 1.1rem; }
        .modal-card input { width: 100%; padding: 12px; text-align: center; font-size: 1.4rem; letter-spacing: 6px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 8px; margin-bottom: 15px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button { flex: 1; padding: 10px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
        .btn-confirm { background: #ffaa00; color: #000; }
        .btn-close-modal { background: #334155; color: #fff; }

        /* PANEL DE CONTROL (ADMIN) */
        .admin-screen { position: absolute; inset: 0; background: #0f172a; z-index: 100; display: none; flex-direction: column; padding: 16px; overflow-y: auto; }
        .admin-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .admin-top h2 { color: #ffaa00; font-size: 1.1rem; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }

        .sec-title { font-size: 0.85rem; color: #94a3b8; margin: 12px 0 6px 0; font-weight: bold; text-transform: uppercase; }
        .f-group { margin-bottom: 10px; }
        .f-group label { display: block; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 3px; }
        .f-group input, .f-group textarea { width: 100%; padding: 9px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 0.85rem; }

        /* LISTA DE PISTAS (PLAYLIST) */
        .playlist-admin { background: #1e293b; border-radius: 8px; padding: 10px; max-height: 180px; overflow-y: auto; border: 1px solid #334155; margin-bottom: 10px; }
        .track-item { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 8px; border-radius: 6px; margin-bottom: 6px; font-size: 0.8rem; border: 1px solid #334155; }
        .track-info { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; margin-right: 8px; }
        .track-controls { display: flex; gap: 4px; }
        .track-controls button { background: #334155; color: #fff; border: none; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; }
        .track-controls button:hover { background: #ffaa00; color: #000; }
        .btn-del { background: #7f1d1d !important; }

        .add-track-box { display: flex; gap: 6px; margin-bottom: 15px; }
        .add-track-box input { flex: 1; padding: 8px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 0.8rem; }
        .btn-add { background: #0284c7; color: white; border: none; padding: 0 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .admin-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-save-admin { background: #10b981; color: white; flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-cancel-admin { background: #475569; color: white; flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER APP -->
        <header class="app-header">
            <div class="channel-info">
                <img id="viewLogo" src="https://via.placeholder.com/36" alt="Logo" class="channel-logo">
                <div>
                    <h1 id="viewName">ZonaCafeteraTv</h1>
                    <div class="live-badge"><span class="live-dot"></span> AL AIRE</div>
                </div>
            </div>
            <button class="btn-icon" onclick="openPinModal()" title="Configuración">⚡</button>
        </header>

        <!-- REPRODUCTOR VIVO -->
        <div class="player-box">
            <div class="overlay-play" id="playOverlay">
                <button class="btn-play-big" onclick="startStream()">▶ INICIAR SEÑAL</button>
            </div>
            <video id="tvPlayer" playsinline controls></video>
        </div>

        <!-- CINTILLO INFERIOR -->
        <div class="ticker-bar">
            <div class="ticker-text" id="viewTicker">Bienvenidos a ZonaCafeteraTv. Disfruta de la mejor programación continua en alta definición. ☕📺</div>
        </div>
    </div>

    <!-- MODAL PIN -->
    <div class="modal-screen" id="pinModal">
        <div class="modal-card">
            <h3>Seguridad del Canal</h3>
            <input type="password" id="pinInput" placeholder="••••" maxlength="4">
            <div class="modal-btns">
                <button class="btn-close-modal" onclick="closePinModal()">Cancelar</button>
                <button class="btn-confirm" onclick="verifyPin()">Entrar</button>
            </div>
        </div>
    </div>

    <!-- PANEL DE CONTROL (ADMIN) -->
    <div class="admin-screen" id="adminPanel">
        <div class="admin-top">
            <h2>Panel Admin - ZonaCafeteraTv</h2>
            <button class="btn-logout" onclick="closeAdmin()">Cerrar Sesión</button>
        </div>

        <div class="f-group">
            <label>Nombre del Canal</label>
            <input type="text" id="inputName" value="ZonaCafeteraTv">
        </div>

        <div class="f-group">
            <label>URL del Logo (Esquina)</label>
            <input type="text" id="inputLogo" placeholder="https://.../logo.png">
        </div>

        <div class="f-group">
            <label>Titulares en Pantalla (Cintillo)</label>
            <textarea id="inputTicker" rows="2"></textarea>
        </div>

        <div class="sec-title">Pistas / Videos en la Nube (Playlist)</div>
        
        <div class="add-track-box">
            <input type="text" id="newTrackUrl" placeholder="Pegar URL de Cloudflare R2 (.mp4)">
            <button class="btn-add" onclick="addTrack()">+ Añadir</button>
        </div>

        <div class="playlist-admin" id="playlistContainer">
            <!-- Las pistas se cargan dinámicamente aquí -->
        </div>

        <div class="admin-actions">
            <button class="btn-cancel-admin" onclick="closeAdmin()">Cancelar</button>
            <button class="btn-save-admin" onclick="saveAdminConfig()">Guardar y Aplicar</button>
        </div>
    </div>

    <script>
        const DEFAULT_PLAYLIST = [
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"
        ];

        let config = JSON.parse(localStorage.getItem('zonacafetera_tv_config')) || {
            name: "ZonaCafeteraTv",
            logo: "https://via.placeholder.com/36",
            ticker: "Bienvenidos a ZonaCafeteraTv. Disfruta de la mejor programación continua en alta definición. ☕📺",
            playlist: DEFAULT_PLAYLIST
        };

        let currentTrackIndex = 0;

        window.onload = function() {
            applyConfig();
        };

        function applyConfig() {
            document.getElementById('viewName').innerText = config.name;
            document.getElementById('viewLogo').src = config.logo;
            document.getElementById('viewTicker').innerText = config.ticker;

            // Cargar en inputs admin
            document.getElementById('inputName').value = config.name;
            document.getElementById('inputLogo').value = config.logo;
            document.getElementById('inputTicker').value = config.ticker;
            renderPlaylistAdmin();
        }

        function startStream() {
            const player = document.getElementById('tvPlayer');
            if (config.playlist.length > 0) {
                player.src = config.playlist[currentTrackIndex];
                player.play().then(() => {
                    document.getElementById('playOverlay').style.display = 'none';
                }).catch(e => {
                    alert("Por favor toca play en los controles del video si el navegador bloquea el autoplay.");
                    document.getElementById('playOverlay').style.display = 'none';
                });

                // Auto-siguiente pista al terminar
                player.onended = function() {
                    currentTrackIndex = (currentTrackIndex + 1) % config.playlist.length;
                    player.src = config.playlist[currentTrackIndex];
                    player.play();
                };
            } else {
                alert("No hay pistas configuradas en la lista.");
            }
        }

        // MODAL PIN
        function openPinModal() {
            document.getElementById('pinInput').value = '';
            document.getElementById('pinModal').style.display = 'flex';
        }
        function closePinModal() {
            document.getElementById('pinModal').style.display = 'none';
        }
        function verifyPin() {
            const pin = document.getElementById('pinInput').value;
            if (pin === "1057") {
                closePinModal();
                document.getElementById('adminPanel').style.display = 'flex';
            } else {
                alert("PIN incorrecto");
                document.getElementById('pinInput').value = '';
            }
        }

        // ADMIN PANEL & PLAYLIST
        function renderPlaylistAdmin() {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = '';
            
            if (config.playlist.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#64748b; padding:10px; font-size:0.75rem;">Sin pistas añadidas</div>';
                return;
            }

            config.playlist.forEach((track, index) => {
                let div = document.createElement('div');
                div.className = 'track-item';
                div.innerHTML = `
                    <div class="track-info"><b>${index + 1}.</b> ${track}</div>
                    <div class="track-controls">
                        <button onclick="moveTrack(${index}, -1)" title="Subir">↑</button>
                        <button onclick="moveTrack(${index}, 1)" title="Bajar">↓</button>
                        <button class="btn-del" onclick="deleteTrack(${index})" title="Eliminar">✕</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function addTrack() {
            const urlInput = document.getElementById('newTrackUrl');
            const url = urlInput.value.trim();
            if (url) {
                config.playlist.push(url);
                urlInput.value = '';
                renderPlaylistAdmin();
            } else {
                alert("Ingresa un enlace válido");
            }
        }

        function moveTrack(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < config.playlist.length) {
                const temp = config.playlist[index];
                config.playlist[index] = config.playlist[newIndex];
                config.playlist[newIndex] = temp;
                renderPlaylistAdmin();
            }
        }

        function deleteTrack(index) {
            config.playlist.splice(index, 1);
            renderPlaylistAdmin();
        }

        function saveAdminConfig() {
            config.name = document.getElementById('inputName').value;
            config.logo = document.getElementById('inputLogo').value;
            config.ticker = document.getElementById('inputTicker').value;

            localStorage.setItem('zonacafetera_tv_config', JSON.stringify(config));
            applyConfig();
            document.getElementById('adminPanel').style.display = 'none';
            alert("¡Configuración guardada y aplicada en tiempo real!");
        }

        function closeAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
        }
    </script>
</body>
</html>
