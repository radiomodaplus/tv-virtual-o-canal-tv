<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZonaCafeteraTv - Canal Virtual en Vivo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* VISTA ESPECTADOR */
        #viewer-app { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; }
        .tv-header { background: rgba(11, 15, 25, 0.9); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f293d; z-index: 10; }
        .logo-area { display: flex; align-items: center; gap: 10px; }
        .logo-area img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #ffaa00; }
        .channel-name { font-size: 1.1rem; font-weight: bold; color: #ffaa00; letter-spacing: 0.5px; }
        
        .lightning-btn { background: none; border: none; color: #6b7280; font-size: 1.2rem; cursor: pointer; padding: 5px; transition: color 0.3s; }
        .lightning-btn:hover { color: #ffaa00; }

        .player-container { flex: 1; background: #000; position: relative; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        .play-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5; transition: opacity 0.3s; }
        .big-play-btn { background: #ffaa00; color: #000; border: none; padding: 15px 35px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,170,0,0.4); }

        /* CINTILLO / TITULARES */
        .ticker-wrap { background: #111827; color: #fff; padding: 10px 0; overflow: white-space; border-top: 2px solid #ffaa00; font-size: 0.9rem; }
        .ticker { display: inline-block; white-space: nowrap; animation: marquee 25s linear infinite; }
        @keyframes marquee { 0% { transform: translate3d(100%, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

        /* PANEL DE CONTROL SECRETO */
        #admin-panel { position: absolute; inset: 0; background: #0f172a; z-index: 100; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .admin-header h2 { color: #ffaa00; font-size: 1.3rem; }
        .close-admin { background: #ef4444; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 0.95rem; }
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { background: #10b981; color: white; flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: #64748b; color: white; flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* MODAL PIN */
        #pin-modal { position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 200; display: none; justify-content: center; align-items: center; }
        .pin-box { background: #1e293b; padding: 30px; border-radius: 12px; width: 90%; max-width: 320px; text-align: center; border: 1px solid #334155; }
        .pin-box h3 { margin-bottom: 15px; color: #ffaa00; }
        .pin-box input { width: 100%; padding: 12px; text-align: center; font-size: 1.5rem; letter-spacing: 5px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; margin-bottom: 15px; }
        .pin-box button { width: 100%; padding: 10px; background: #ffaa00; color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- VISTA PRINCIPAL (ESPECTADOR) -->
    <div id="viewer-app">
        <header class="tv-header">
            <div class="logo-area">
                <img id="display-logo" src="https://via.placeholder.com/35" alt="Logo">
                <span class="channel-name" id="display-title">ZonaCafeteraTv</span>
            </div>
            <button class="lightning-btn" onclick="openPinModal()">⚡</button>
        </header>

        <div class="player-container">
            <div class="play-overlay" id="playOverlay">
                <button class="big-play-btn" onclick="startChannel()">▶ VER SEÑAL EN VIVO</button>
            </div>
            <video id="tvPlayer" playsinline controls></video>
        </div>

        <div class="ticker-wrap">
            <div class="ticker" id="display-ticker">¡Bienvenidos a ZonaCafeteraTv! Disfruta de la mejor programación en vivo y en directo desde la nube. ☕📺</div>
        </div>
    </div>

    <!-- MODAL DE PIN SECRETO -->
    <div id="pin-modal">
        <div class="pin-box">
            <h3>Seguridad Panel</h3>
            <input type="password" id="pinInput" placeholder="••••" maxlength="4">
            <button onclick="verifyPin()">Ingresar</button>
            <button style="background:transparent; color:#94a3b8; margin-top:10px; border:none;" onclick="closePinModal()">Cancelar</button>
        </div>
    </div>

    <!-- PANEL DE CONTROL (ADMIN) -->
    <div id="admin-panel">
        <div class="admin-header">
            <h2>Panel de Control - ZonaCafeteraTv</h2>
            <button class="close-admin" onclick="logoutAdmin()">Cerrar Sesión</button>
        </div>

        <div class="form-group">
            <label>Nombre del Canal</label>
            <input type="text" id="inputChannelName" value="ZonaCafeteraTv">
        </div>

        <div class="form-group">
            <label>URL del Logo (Esquina)</label>
            <input type="text" id="inputLogoUrl" placeholder="https://tu-nube.r2.dev/logo.png">
        </div>

        <div class="form-group">
            <label>Enlace del Video en Vivo (Cloudflare R2 u otro)</label>
            <input type="text" id="inputVideoUrl" placeholder="https://pub-xxxx.r2.dev/video-en-vivo.mp4">
        </div>

        <div class="form-group">
            <label>Titulares en Movimiento (Cintillo)</label>
            <textarea id="inputTickerText" rows="3">¡Bienvenidos a ZonaCafeteraTv! Disfruta de la mejor programación en vivo.</textarea>
        </div>

        <div class="btn-row">
            <button class="btn-cancel" onclick="logoutAdmin()">Cancelar</button>
            <button class="btn-save" onclick="saveConfig()">Guardar y Aplicar</button>
        </div>
    </div>

    <script>
        const DEFAULT_VIDEO = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";

        // Cargar datos guardados o por defecto
        let config = JSON.parse(localStorage.getItem('zonacafetera_config')) || {
            name: "ZonaCafeteraTv",
            logo: "https://via.placeholder.com/35",
            video: DEFAULT_VIDEO,
            ticker: "¡Bienvenidos a ZonaCafeteraTv! Disfruta de la mejor programación en vivo y en directo desde la nube. ☕📺"
        };

        window.onload = function() {
            applyConfigToViewer();
        };

        function applyConfigToViewer() {
            document.getElementById('display-title').innerText = config.name;
            document.getElementById('display-logo').src = config.logo;
            document.getElementById('display-ticker').innerText = config.ticker;
            document.getElementById('tvPlayer').src = config.video;

            // Rellenar inputs del admin
            document.getElementById('inputChannelName').value = config.name;
            document.getElementById('inputLogoUrl').value = config.logo;
            document.getElementById('inputVideoUrl').value = config.video;
            document.getElementById('inputTickerText').value = config.ticker;
        }

        function startChannel() {
            const player = document.getElementById('tvPlayer');
            player.play().then(() => {
                document.getElementById('playOverlay').style.opacity = '0';
                setTimeout(() => { document.getElementById('playOverlay').style.display = 'none'; }, 300);
            }).catch(e => {
                alert("Toca reproducir en los controles del video si tu navegador bloquea el inicio automático.");
                document.getElementById('playOverlay').style.display = 'none';
            });
        }

        function openPinModal() {
            document.getElementById('pinInput').value = '';
            document.getElementById('pin-modal').style.display = 'flex';
        }

        function closePinModal() {
            document.getElementById('pin-modal').style.display = 'none';
        }

        function verifyPin() {
            const pin = document.getElementById('pinInput').value;
            if (pin === "1057") {
                closePinModal();
                document.getElementById('admin-panel').style.display = 'flex';
            } else {
                alert("PIN incorrecto");
                document.getElementById('pinInput').value = '';
            }
        }

        function saveConfig() {
            config.name = document.getElementById('inputChannelName').value;
            config.logo = document.getElementById('inputLogoUrl').value;
            config.video = document.getElementById('inputVideoUrl').value;
            config.ticker = document.getElementById('inputTickerText').value;

            localStorage.setItem('zonacafetera_config', JSON.stringify(config));
            applyConfigToViewer();
            
            document.getElementById('admin-panel').style.display = 'none';
            alert("¡Cambios aplicados en tiempo real con éxito!");
        }

        function logoutAdmin() {
            document.getElementById('admin-panel').style.display = 'none';
        }
    </script>
</body>
</html>
